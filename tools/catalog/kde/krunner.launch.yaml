name: kde.krunner.launch
domain: kde
description: Launch an application on the KDE desktop by name.
risk: low
confirmation_required: false
allowed_in_production: true
executor: surya_agent.executors.kde.krunner_launch

parameters:
  type: object
  required:
    - app
  properties:
    app:
      type: string
      description: Application name or command to launch (e.g. kate, dolphin, konsole).

examples:
  - Open Kate.
  - Launch Dolphin.
  - Open a terminal.
  - Start Firefox.
  - Open the file manager.

  - open konsole
  - run spotify
  - open files
  - launch the browser
  - open web browser
  - open the text editor
  - open code editor
  - start the email client
  - open settings
  - open system settings
  - show calculator
  - open music player
  - lanch dolphin
  - opn firefox
aliases:
  - kde.app.launch
  - app.open

tags:
  - kde
  - kstart
  - launcher
  - quick-action

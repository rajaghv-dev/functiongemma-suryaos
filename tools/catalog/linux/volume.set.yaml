name: linux.volume.set
domain: linux
description: Adjust the audio volume up or down by a percentage.
risk: low
confirmation_required: false
allowed_in_production: true
executor: surya_agent.executors.linux.volume_set

parameters:
  type: object
  required:
    - direction
  properties:
    direction:
      type: string
      enum: [up, down]
      description: Direction to change the volume.
    step:
      type: integer
      minimum: 1
      maximum: 100
      description: Percentage to change volume by (default 5).

examples:
  - Turn the volume up by 10 percent.
  - Lower the volume.
  - Make it quieter.
  - Increase audio level.

aliases:
  - linux.volume.change
  - volume.adjust

tags:
  - audio
  - pactl
  - quick-action

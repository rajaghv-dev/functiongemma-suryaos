# =============================================================================
# Loki configuration — minimal single-node setup for local training observability.
#
# This is NOT production-grade. It runs everything in-process (ingester, querier,
# storage) which is fine for one machine but would not scale. For production,
# split into separate components and use object storage (S3, GCS).
# =============================================================================

auth_enabled: false   # no multi-tenant auth — single user

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Where Loki stores its internal state (ingester WAL, etc.)
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks       # log chunks (the actual log data)
      rules_directory: /loki/rules         # alerting/recording rules
  replication_factor: 1                    # single node = no replication
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Schema: how logs are indexed. boltdb-shipper is the modern choice.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h    # one index file per day

# Limits — generous for a single-machine setup
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # accept logs up to 1 week old
  ingestion_rate_mb: 10              # 10 MB/s per stream is plenty for training
  ingestion_burst_size_mb: 20
  max_query_series: 100000
  allow_structured_metadata: false   # required for v13 schema with simple config

# Retention: how long to keep logs. 30 days is enough for tracking experiments.
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h   # 30 days

ruler:
  alertmanager_url: http://localhost:9093
